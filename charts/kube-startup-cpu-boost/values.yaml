controllerManager:
  manager:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    env:
      leaderElection: "true"
      removeLimits: "true"
    image:
      repository: ghcr.io/google/kube-startup-cpu-boost
      tag: v0.20.0 #x-release-please-version
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  nodeSelector: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/arch
            operator: In
            values:
            - amd64
            - arm64
          - key: kubernetes.io/os
            operator: In
            values:
            - linux
  podSecurityContext:
    runAsNonRoot: true
  replicas: 1
  pdb:
    create: false
    minAvailable: 1
    # maxUnavailable: 1
  tolerations: []
  topologySpreadConstraints: []
  serviceAccount:
    annotations: {}
kubernetesClusterDomain: cluster.local
webhookService:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  type: ClusterIP
